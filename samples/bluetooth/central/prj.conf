CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_LOG=y

# ── Select connection mode (choose one) ─────────────────────────────────────
#
# Mode A: Auto-connect by device name
#CONFIG_BT_TARGET_NAME="SYNA SR110"
#
# Mode B: Auto-connect by MAC address
#CONFIG_BT_TARGET_ADDR="AA:BB:CC:DD:EE:FF (random)"
#
# Mode C (default): Scan 5 s → show list → pick by number
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y

# ── SR110 + SYNA hardware ─────────────────────────────────────────────────
CONFIG_BT_H4=y
CONFIG_BT_HCI_SYNA=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_XIP=n
CONFIG_SRAM_SIZE=384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_BUF_CMD_TX_SIZE=255
