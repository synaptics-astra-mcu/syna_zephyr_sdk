# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth HOST stack
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y

# Device name visible in scan responses
CONFIG_BT_DEVICE_NAME="SYNA SR110"

# HCI H:4 UART transport
CONFIG_BT_H4=y

# Synaptics SYNA vendor setup (REGON + patchram)
CONFIG_BT_HCI_SYNA=y

# GPIO (for BT_REGON)
CONFIG_GPIO=y

# UART interrupt-driven mode (required by H4 HCI driver)
CONFIG_UART_INTERRUPT_DRIVEN=y

# Extend SRAM to full VM0 region (384KB) — needed for BT HOST stack buffers
CONFIG_SRAM_SIZE=384

# No XIP: run from SRAM
CONFIG_XIP=n

# Stack sizes — BT init (patchram download) needs significant depth
# Main thread: default 1KB is too small when bt_enable(NULL) runs init inline.
# We use bt_enable(callback) so init runs in BT workq, but keep main larger too.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

# SYNA WRITE_RAM patchram records can be up to 255 bytes.
# Default BT_BUF_CMD_TX_SIZE=65 is too small → buffer overflow → chip returns
# INVALID_PARAM (0x12) → bt_hci_cmd_send_sync returns -EINVAL (-22).
CONFIG_BT_BUF_CMD_TX_SIZE=255
