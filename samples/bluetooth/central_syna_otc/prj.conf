# ── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OTS=y
CONFIG_BT_SMP=y
CONFIG_BT_OTS_CLIENT=y
CONFIG_BT_OTS_OACP_CHECKSUM_SUPPORT=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# ── Console ──────────────────────────────────────────────────────────────────
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_PRINTK=y

CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

CONFIG_ASSERT=y

# ── BT Buffer and data length (MTU) configuration ──────────────────────────
# Maximum LE packet payload is 251 bytes (BLE 5.0)
# L2CAP header adds 4 bytes, so total ACL buffer should be 255 bytes minimum
# This prevents fragmentation for 21-byte OACP payloads
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=20
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=3
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
# Three CCCD subscriptions can still be in flight when the first OTS read starts.
CONFIG_BT_ATT_TX_COUNT=4

# ── SR110 + SYNA hardware ──────────────────────────────────────────────────
CONFIG_BT_H4=y
CONFIG_BT_HCI_SYNA=y
CONFIG_BT_HCI_SYNA_BAUD_RATE=3000000
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_UART_NS16550_VARIANT_NS16750=y

# ── Per-object size note (see also src/main.c) ──────────────────────────────
# This sample's local read buffer (OBJ_MAX_SIZE in src/main.c, currently
# 1024 bytes) must be large enough to hold the largest object the peer OTS
# server can serve. The server side controls the actual per-object size
# limit (its own OBJ_MAX_SIZE) and the max object count
# (CONFIG_BT_OTS_MAX_OBJ_CNT) — see
# samples/bluetooth/peripheral_syna_ots/prj.conf for the matching server-side
# settings. If the server's object size is increased beyond 1024 bytes,
# bump OBJ_MAX_SIZE here to match, otherwise reads will be truncated/rejected.
CONFIG_XIP=n
