# Console
CONFIG_XIP=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Logging
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_METAKEYS=y

# UART (NS16750 variant for BT UART)
CONFIG_UART_ASYNC_API=y
CONFIG_UART_NS16550_VARIANT_NS16750=y

# GPIO Support
CONFIG_GPIO=y

# Reboot
CONFIG_REBOOT=y

# Extend SRAM to full VM0 region (0x33ea0000..0x33F00000 = 384KB).
# The default 128KB is too small to hold both app code and the 134KB BT FW patch.
CONFIG_SRAM_SIZE=384
