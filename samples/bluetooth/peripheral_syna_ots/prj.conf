# ── Bluetooth ────────────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Zephyr OTS SR110"
CONFIG_BT_OTS=y
CONFIG_BT_OTS_DIR_LIST_OBJ=y
CONFIG_BT_OTS_OBJ_NAME_WRITE_SUPPORT=y
CONFIG_BT_OTS_OACP_WRITE_SUPPORT=y
CONFIG_BT_OTS_OACP_PATCH_SUPPORT=y
CONFIG_BT_OTS_OACP_CREATE_SUPPORT=y
CONFIG_BT_OTS_OACP_DELETE_SUPPORT=y
CONFIG_BT_OTS_OACP_CHECKSUM_SUPPORT=y
CONFIG_BT_OTS_OBJECT_CHANGED_SUPPORT=y

# ── Console ──────────────────────────────────────────────────────────────────
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_PRINTK=y

CONFIG_ASSERT=y

# Console input for interactive menu
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# BT init + patchram download is sensitive to UART/RX buffering
CONFIG_BT_RX_STACK_SIZE=4096

# ── SR110 + SYNA hardware ──────────────────────────────────────────────────
CONFIG_BT_H4=y
CONFIG_BT_HCI_SYNA=y
CONFIG_BT_HCI_SYNA_BAUD_RATE=3000000
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_UART_NS16550_VARIANT_NS16750=y
# ── BT Buffer and L2CAP MTU configuration ──────────────────────────────────
# CONFIG_BT_OTS_L2CAP_CHAN_TX_MTU defaults to 256 bytes, but without the
# overrides below the ACL/L2CAP TX path falls back to tiny Zephyr defaults
# (BT_BUF_ACL_TX_SIZE=27, BT_L2CAP_TX_MTU=65). That forces every OTS object
# data K-frame to be fragmented into ~10 undersized ACL packets, which was
# observed to trigger a controller "Hardware error" (hardware code 0) on the
# BCM4381A1 during L2CAP CoC object reads. Size the buffers to match the
# 256-byte OTS channel MTU (mirrors central_syna_otc/prj.conf).
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_L2CAP_TX_MTU=256
CONFIG_BT_L2CAP_TX_BUF_COUNT=8

# ── Per-object size / object count (see also src/main.c) ───────────────────
# The size of a single OTS object and the number of objects the server can
# hold at once are two SEPARATE knobs:
#   - OBJ_MAX_SIZE (defined in src/main.c, currently 1024 bytes) sets the
#     max size of a single object's data buffer. It is a sample-only define,
#     not part of the Zephyr OTS stack.
#   - CONFIG_BT_OTS_MAX_OBJ_CNT (below, default 5) sets how many objects the
#     OTS instance can manage at once.
# Static RAM used by the demo object pool is roughly:
#   OBJ_MAX_SIZE * CONFIG_BT_OTS_MAX_OBJ_CNT (+ per-object metadata)
# Increase either value if you need bigger or more objects, but check your
# available SRAM budget first — raising either one directly increases the
# static memory footprint. (Protocol-wise, object size can go up to 2^16-1
# per Zephyr's net_buf-based Kconfig help text; 1024 here is just what the
# sample hard-codes.)
#
# NOTE: CONFIG_BT_OTS_MAX_OBJ_CNT counts ALL objects in the shared pool,
# including the Directory Listing Object, which is auto-reserved because
# CONFIG_BT_OTS_DIR_LIST_OBJ=y is enabled above. So with N configured here,
# only N-1 slots are actually available for user-created objects via
# bt_ots_obj_add() (e.g. add_photo_object()). This was confirmed on real
# hardware: setting N=5 only allows 4 objects to be created.
CONFIG_BT_OTS_MAX_OBJ_CNT=0x05
CONFIG_XIP=n
