# AutoPTS tester profile for SR100:
# Keep core tester functionality while fitting SR100 RAM budget.

CONFIG_UART_PIPE=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

CONFIG_BT_OTS=n
CONFIG_BT_EXT_ADV=n
CONFIG_BT_PER_ADV=n
CONFIG_BT_PER_ADV_SYNC=n
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=n
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=n
CONFIG_BT_ISO_BROADCASTER=n
CONFIG_BT_ISO_SYNC_RECEIVER=n
CONFIG_BT_ISO_CENTRAL=n
CONFIG_BT_ISO_PERIPHERAL=n
CONFIG_BT_EATT=n

CONFIG_BT_L2CAP_TX_MTU=100
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_BUF_EVT_RX_SIZE=70
CONFIG_BT_BUF_ACL_TX_SIZE=100
CONFIG_BT_BUF_ACL_RX_SIZE=100
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=0
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_L2CAP_TX_FRAG_COUNT=2
