# HCI H:4 UART transport + SYNA vendor setup (REGON + patchram)
# CONFIG_UART_USE_RUNTIME_CONFIGURE is auto-selected by BT_HCI_SYNA
CONFIG_BT_H4=y
CONFIG_BT_HCI_SYNA=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# No XIP: run from SRAM
CONFIG_XIP=n
CONFIG_SRAM_SIZE=384

# Stack sizes: patchram download needs depth; BT HOST needs large RX stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096

# HCI command buffer must fit SYNA WRITE_RAM records (up to 255 bytes)
CONFIG_BT_BUF_CMD_TX_SIZE=255
