CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_AVDTP=y
CONFIG_BT_A2DP=y
CONFIG_BT_A2DP_SOURCE=y
CONFIG_LIBSBC=y
CONFIG_BT_DEVICE_NAME="SR110 A2DP Source"
CONFIG_BT_COD=0x000104
CONFIG_BT_DID=y
CONFIG_BT_DEVICE_VEDNOR_ID=0x0000
CONFIG_BT_DEVICE_PRODUCT_ID=0x0001
CONFIG_BT_DEVICE_VERSION=0x0001
CONFIG_BT_CONN_TX_MAX=15
CONFIG_BT_BUF_ACL_TX_SIZE=512
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_ACL_RX_SIZE=1024

# SR110 + SYNA hardware
CONFIG_BT_H4=y
CONFIG_BT_HCI_SYNA=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_XIP=n
CONFIG_SRAM_SIZE=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_BUF_CMD_TX_SIZE=255

# Console input for device selection
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# Logging
CONFIG_BT_A2DP_LOG_LEVEL_DBG=y
CONFIG_BT_AVDTP_LOG_LEVEL_DBG=y
CONFIG_BT_SDP_LOG_LEVEL_INF=y
CONFIG_BT_L2CAP_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_L2CAP_RX_FLUSH_TO=0x0001
CONFIG_LOG_PRINTK=n

# Disable unsupported features
CONFIG_SHELL=n
CONFIG_MBEDTLS_PSA_CRYPTO_C=n
