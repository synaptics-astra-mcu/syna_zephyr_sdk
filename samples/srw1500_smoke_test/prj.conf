CONFIG_USERSPACE=y
CONFIG_ASSERT=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536

# Shell configuration
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_BOOT_BANNER=y
CONFIG_SHELL_PROMPT_UART="Srw1500:$ "
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512
CONFIG_LOG=y
# Synchronous output so early-boot and fault-path messages are not lost.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_MODE_MINIMAL=n

# Syscounter
# Slowclock timer
# Timer
CONFIG_COUNTER=y

# GPIO
CONFIG_GPIO=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_TARGET=y

# SPI
CONFIG_SPI=y

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_WDOG_CMSDK_SYNA=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

# Mailbox to secure co-processor (SPROT_MBOX)
CONFIG_MBOX=y

# OTP Provisioning
CONFIG_OTP_PROVISIONED_ENABLED=n
CONFIG_OTP_PROVISIONED_V2_ENABLED=y
CONFIG_OTP_PROVISIONED_DISABLED=n
CONFIG_OTP=y
CONFIG_OTP_SHELL=y
CONFIG_OTP_PROGRAM=y

# File System
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y

# RAM FS
CONFIG_FILE_SYSTEM_MKFS=y

# Pinctrl
CONFIG_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_MAP_CUSTOM=y
CONFIG_FLASH_PAGE_LAYOUT=y

# LittleFS
CONFIG_FILE_SYSTEM_LITTLEFS=y

# LittleFS tuning
CONFIG_FS_LITTLEFS_READ_SIZE=256
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=32
CONFIG_FS_LITTLEFS_BLOCK_CYCLES=512

# Disable RWW feature here if required. By default it is enabled.
# CONFIG_CDNS_XSPI_RWW=n
