# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_I2S_SHELL_LOG_LEVEL=3
CONFIG_I2S_SHELL_PRINT_CAPTURE_INFO=n

# Shell and console
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_DEVICE_SHELL=y

# I2S and DMA
CONFIG_I2S=y
CONFIG_DMA=y
CONFIG_DMA_INIT_PRIORITY=50
CONFIG_MBOX=n

# Runtime memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_I2S_SHELL_BLOCK_SIZE=8192
CONFIG_I2S_SHELL_BLOCK_COUNT=32

CONFIG_I2S_SHELL_WORKER_STACK_SIZE=4096
CONFIG_I2S_SHELL_WRITER_STACK_SIZE=4096
CONFIG_I2S_SHELL_WORKER_PRIORITY=5

CONFIG_I2S_SHELL_WRITE_BUFFER_COUNT=64
CONFIG_I2S_SHELL_WRITE_BUFFER_BYTES=16384

# Filesystem and flash map
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_MAP=y
CONFIG_FS_LITTLEFS_NUM_FILES=8
CONFIG_FS_LITTLEFS_NUM_DIRS=8
CONFIG_FS_LITTLEFS_CACHE_SIZE=1024
CONFIG_FS_LOG_LEVEL_WRN=y

# Keep unrelated shell/log noise low
CONFIG_I2C_SHELL=n
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_I2C_LOG_LEVEL_OFF=y
CONFIG_GPIO_LOG_LEVEL_OFF=y
