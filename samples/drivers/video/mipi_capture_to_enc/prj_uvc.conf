#
# USB video (UVC) transport configuration for the mipi_capture_to_enc sample.
#
# Include this config when building with CONFIG_USB_TRANSPORT_UVC=y, e.g.:
#   -DEXTRA_CONF_FILE=prj_uvc.conf
#

# USB device stack / UDC tuning
CONFIG_USBD_MAX_SPEED_FULL=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_BOS_SUPPORT=n
CONFIG_USBD_VREQ_SUPPORT=n
CONFIG_UDC_BUF_POOL_SIZE=2048
CONFIG_USBD_MAX_UDC_MSG=8
CONFIG_USBD_MSG_SLAB_COUNT=8
CONFIG_USBD_HWINFO_DEVID_LENGTH=8

# USB threads can get tight with logging + DMA; keep some headroom.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DWC2_STACK_SIZE=2048

# MIPI capture, JPEG encoder output, and UVC TX each need video buffer descriptors.
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=262144

# Quiet USB/UDC logs during frame streaming.
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
