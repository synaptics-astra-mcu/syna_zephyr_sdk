# Synaptics SRW1500 supplicant backend for the upstream Wi-Fi shell sample.
CONFIG_WIFI=y
CONFIG_WIFI_SYNA=y
CONFIG_WIFI_SRW1500=y
CONFIG_NETWORKING=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_POSIX_API=y
# CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_NONE is not set
CONFIG_WIFI_NM_WPA_SUPPLICANT_CLI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_DBG=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_DEBUG_LEVEL=2
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_DISK_DRIVER_RAM=n
 
# CONFIG_MHD_LOGGING_DEBUG=y
 
CONFIG_USERSPACE=y
CONFIG_ASSERT=y
CONFIG_MAX_THREAD_BYTES=3
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=4
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=307200
CONFIG_EVENTS=y

CONFIG_FTP_CLIENT=n
CONFIG_HTTP_CLIENT=n

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_ARP=y
 
CONFIG_NET_L2_ETHERNET_RESERVE_HEADER=y

# zperf
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_ZVFS_POLL_MAX=10

# con_boot uses the CMSIS-RTOS2 time adapter on Zephyr.
CONFIG_CMSIS_RTOS_V2=y
CONFIG_NUM_PREEMPT_PRIORITIES=56


CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_MBEDTLS_PSA=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3=y
CONFIG_MBEDTLS_ECP_NIST_OPTIM=y

CONFIG_NET_BUF_DATA_SIZE=1568
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=24

CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=12288
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=8192

