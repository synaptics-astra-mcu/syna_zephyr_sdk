# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Shell core
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_CHANGE=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="syna:~$ "

# UX features
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=1024
CONFIG_SHELL_TAB_AUTOCOMPLETION=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_WILDCARD=y

# Optional modules
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# drivers and subsystems
CONFIG_I2C=y
CONFIG_I2C_DW=y

CONFIG_FLASH=y
CONFIG_FLASH_CAD_XSPI=y
CONFIG_FLASH_SHELL=y

CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y

# File system — LittleFS on storage_partition
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=2
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_READ_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FS_LITTLEFS_LOOKAHEAD_SIZE=256
CONFIG_FS_LITTLEFS_BLOCK_CYCLES=512

# CRC (used by lfs_test)
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_DMA=y
CONFIG_DMA_INIT_PRIORITY=50
