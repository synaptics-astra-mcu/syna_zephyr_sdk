CONFIG_XIP=y
CONFIG_FLASH_BASE_ADDRESS=0x38000000
CONFIG_FLASH_SIZE=32768
CONFIG_FLASH_LOAD_OFFSET=0x2b000
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=640
CONFIG_MCUBOOT_BOOT_MAX_ALIGN=32
CONFIG_FLASH_MAP_CUSTOM=y
CONFIG_SINGLE_APPLICATION_SLOT=y

CONFIG_MBOX=y
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Synaprot Service
CONFIG_SYNAPROT_SERVICE=y

# Surface the BOOT_LOG_DBG traces in the image verification path.
# CONFIG_MCUBOOT_LOG_LEVEL_DBG=y

# --- UART serial recovery (mcumgr/SMP over serial) ---
# Selects SERIAL, UART_INTERRUPT_DRIVEN, BASE64, CRC, ZCBOR and REBOOT.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# Recovery runs on uart1 (chosen zephyr,uart-mcumgr) so the MCUboot log can stay
# on uart0; serial_adapter.c hard-errors if the two resolve to the same node.
CONFIG_UART_CONSOLE=y

# Timeout entry: no extra board wiring needed. Send any mcumgr frame within the
# window to stay in recovery.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000

# GPIO entry is "default y" whenever CONFIG_GPIO is on, and io.c then requires a
# 'mcuboot_button0' DT alias. Keep it off unless that alias is defined.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Erase as data arrives; the 2.5 MiB slot0 is too large to pre-erase in one go.
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_BOOT_MAX_LINE_INPUT_LEN=512
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=1024

# xSPI page/write alignment for this part.
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=64
