CONFIG_FLASH_BASE_ADDRESS=0x38000000
CONFIG_FLASH_SIZE=32768
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U_ARM=y
CONFIG_ETHOS_U55_128=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_HEAP_MEM_POOL_SIZE=199680
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=y
CONFIG_USBD_MAX_SPEED_HIGH=y
CONFIG_UDC_DWC2_HIBERNATION=n
CONFIG_UDC_DWC2_DMA=n

# USB Virtual UART
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# Shell and Log
# Set to n for USB shell and log.
CONFIG_LOG_BACKEND_UART=y
# Set to y for USB shell and log.
CONFIG_SHELL_LOG_BACKEND=n
