description: Synaptics SR100 trigger / mailbox

compatible: "syna,mbox-sr100"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true

  shared-memory:
    required: true
    type: phandle

  shared-memory-size:
    required: true
    type: int

  interrupts:
    required: true

mbox-cells:
  - channel
