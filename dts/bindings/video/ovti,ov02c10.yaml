description: OmniVision OV02C10 CMOS image sensor

compatible: "ovti,ov02c10"

include: [i2c-device.yaml, pinctrl-device.yaml]

properties:
  powerdown-gpios:
    type: phandle-array
    description: |
      GPIO that enables the external supply for the sensor. The driver
      drives this GPIO to its active state before enabling MCLK and
      accessing the sensor over I2C.

  shutdown-gpios:
    type: phandle-array
    description: |
      Board-level sensor shutdown/control GPIO. The driver drives this
      GPIO to its active state before enabling MCLK and accessing the
      sensor over I2C.

  mclk-control-reg:
    type: int
    description: |
      Optional Synaptics SoC register address used to enable the external
      sensor clock. On SR110, this controls CLKOUT0.

  mclk-control-val:
    type: int
    description: |
      Value written to syna,mclk-control-reg.

  power-up-delay-ms:
    type: int
    default: 100
    description: |
      Delay after board power/control GPIOs are enabled.

  mclk-settle-delay-ms:
    type: int
    default: 10
    description: |
      Delay after the sensor MCLK register is programmed.

child-binding:
  child-binding:
    include: video-interfaces.yaml
