description: Synaptics srw1500 Clock Controller

compatible: "syna,srw1500-clock"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  clock-frequency:
    type: int
    description: Input crystal frequency in Hz.

  "#clock-cells":
    const: 1

clock-cells:
  - clkid
