description: Synaptics SL family SoCs ACPU domain clk

compatible: "syna,sl-clk"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  clocks:
    type: phandle-array
    required: true

  "#clock-cells":
    const: 1

clock-cells:
  - clkid
