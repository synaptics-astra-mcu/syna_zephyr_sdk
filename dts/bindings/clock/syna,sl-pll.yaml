description: Synaptics SL family SoCs ACPU domain pll

compatible: "syna,sl-pll"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    type: array
    required: true

  clocks:
    required: true

  bypass-shift:
    type: int
    required: true

  dm:
    type: int

  dn:
    type: int

  dp0:
    type: int

  dp1:
    type: int

  frac:
    type: int

  pd-bypass:
    type: boolean

  "#clock-cells":
    const: 1

clock-cells:
  - clkid
