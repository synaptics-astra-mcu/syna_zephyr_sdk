description: Synopsys DWC Mobile Storage Host Controller

compatible: "snps,mshc"

include: [sdhc.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clock-frequency:
    type: int
    description: Clock frequency input to controller

  no-dma:
    type: boolean
    description: Always use PIO

  vmmc-supply:
    type: phandle
    description: |
      Supply for the card power
      If the level shifter is controlled by a GPIO line, this shall
      be modeled as a "regulator-fixed" with a GPIO line for
      switching the level shifter on/off.

  vmmcq-supply:
    type: phandle
    description: |
      Supply for the card power - 1.8 or 3.3V
      If the level shifter is controlled by a GPIO line, this shall
      be modeled as a "regulator-fixed" with a GPIO line for
      switching the level shifter on/off.
