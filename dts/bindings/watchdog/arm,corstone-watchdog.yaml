description: ARM CMSDK watchdog

compatible: "arm,corstone-watchdog"

include: base.yaml

properties:
  reg:
    required: true

  system_counter:
    type: phandle
    required: true

  flight_control:
    type: phandle
    required: true

  interrupts:
    required: true

  fault_num:
    type: int
    required: true
