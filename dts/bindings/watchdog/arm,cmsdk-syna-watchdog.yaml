description: ARM CMSDK watchdog

compatible: "arm,cmsdk-syna-watchdog"

include: base.yaml

properties:
  reg:
    required: true
  
  clocks:
    required: true

  flight_control:
    type: phandle
    required: true

  interrupts:
    required: true

  fault_num:
    type: int
    required: true
