description: Synaptics SRW1500 USB device controller

compatible: "syna,srw1500-usb"

include: ["snps,dwc2.yaml", reset-device.yaml]

properties:
  ghwcfg3:
    type: int
    required: true
    description: Value of the GHWCFG3 register.

  phy-utmi-width:
    type: int
    required: true
    enum:
      - 8
      - 16
    description: UTMI+ interface width.
