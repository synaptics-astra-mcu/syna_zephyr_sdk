description: Cadence XSPI flash controller

compatible: "cdns,xspi"

include: [flash-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  assigned-clock-rates:
    type: int
    required: true
    description: |
      The frequency of XSPI_CLK

  erase-block-size:
    type: int
    const: 4096
    description: Minimum erase size for (Q)SPI flashes is usually 4 KiB.

  write-block-size:
    type: int
    const: 1
    description: Smallest programmable unit is 1 bytes.

  use-direct-mode:
    type: boolean
    description: Enable direct mode for read/write operations instead of STIG mode
