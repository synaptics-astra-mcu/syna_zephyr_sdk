description: ARM DMA250/350

compatible: "arm,dma-350"

include: [dma-controller.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  "#dma-cells":
    const: 1

  cntxbase:
    type: int
    description: |
      Context area

  nonsecure-triggers:
    type: int
    description: |
      Security setting for each trigger/slot (1: non-secure, 0: secure/default)

  perif-channel:
    type: int
    description: |
      Number of first channel for peripheral transfers (prior channels are for
      memory-to-memory transfers, with larger FIFO and 2D capabilities)

# Parameter syntax
dma-cells:
  - channel
