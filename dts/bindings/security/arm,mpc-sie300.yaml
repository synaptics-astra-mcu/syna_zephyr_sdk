description: Arm MPC SIE-300 Memory Protection Controller
compatible: "arm,mpc-sie300"

include: base.yaml

properties:
  reg:
    required: true
  arm,controlled-ranges:
    type: array
    description: |
      Deprecated for this port. The Srw1500 range map is programmed from C.
  arm,nonsecure-regions:
    type: array
    description: |
      Deprecated for this port. The Srw1500 NS memory policy is programmed
      from C.
  lockdown:
    type: boolean
    description: Set MPC secure lockdown bit after configuration.
