description: Armv8-M TCM Gating Unit
compatible: "arm,tgu-armv8-m"

include: base.yaml

properties:
  reg:
    required: true
  arm,controlled-ranges:
    type: array
    description: |
      Deprecated for this port. The Srw1500 TCM range map is programmed from C.
  arm,nonsecure-regions:
    type: array
    description: |
      Deprecated for this port. TCM remains secure by default.
